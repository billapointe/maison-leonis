# Gate désactivée par défaut. Pour une preview privée :
# GATE_PASSWORD=ton-mot-de-passe dans Netlify → Environment variables.

[build]
  command = "node scripts/generate-auth-config.mjs"
  publish = "."

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 302

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
