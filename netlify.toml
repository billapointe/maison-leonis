# Gate désactivée par défaut. Pour une preview privée :
# GATE_PASSWORD=ton-mot-de-passe dans Netlify → Environment variables.

[build]
  command = "node scripts/generate-auth-config.mjs"
  publish = "."

# Site fermé : toutes les routes servent closed.html (statut 503).
# Pour rouvrir le site, supprime ce bloc [[redirects]].
[[redirects]]
  from = "/*"
  to = "/closed.html"
  status = 503
  force = true

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 302

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
